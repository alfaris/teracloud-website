# nginx in front of the Next.js server (container or systemd service on 127.0.0.1:3000).
# Adjust certificate paths; obtain certificates with your usual tooling (e.g. certbot).

upstream teracloud_web {
  server 127.0.0.1:3000;
  keepalive 32;
}

# HTTP → HTTPS
server {
  listen 80;
  listen [::]:80;
  server_name teracloud.com www.teracloud.com;
  return 301 https://teracloud.com$request_uri;
}

# www → apex
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name www.teracloud.com;
  ssl_certificate     /etc/ssl/teracloud/fullchain.pem;
  ssl_certificate_key /etc/ssl/teracloud/privkey.pem;
  return 301 https://teracloud.com$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name teracloud.com;

  ssl_certificate     /etc/ssl/teracloud/fullchain.pem;
  ssl_certificate_key /etc/ssl/teracloud/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  client_max_body_size 1m;   # only the contact form posts data
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Build assets are content-hashed: cache forever.
  location /_next/static/ {
    proxy_pass http://teracloud_web;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    proxy_pass http://teracloud_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    # Pages stream (Partial Prerendering); don't buffer them.
    proxy_buffering off;
    add_header X-Accel-Buffering no;
  }
}
